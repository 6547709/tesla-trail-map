name: Build & publish multi-arch image

# Triggers:
#  - push to main / PR  → build only (no push), to catch breakage early
#  - push of a vN.N tag → build + push linux/amd64 + linux/arm64 to GHCR
#  - manual run         → same as tag, with a custom tag input
on:
  push:
    branches: [main]
    tags: ['v*.*', 'v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish as (e.g. v1.5)'
        required: true
        default: 'v1.5'

# We push to ghcr.io/<owner>/<repo>. Make the package public via
#   Repo → Settings → Packages once after the first run.
permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & push (amd64 + arm64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (for cross-arch emulation when needed)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64,amd64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Resolve the version string from the tag, the manual input, or "dev".
      - name: Resolve version
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ github.event.inputs.tag }}" ]]; then
            echo "version=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
          echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        # Skip auth on PRs from forks — they don't have packages:write anyway.
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # We use two-segment tags like v1.5 (not strict semver vX.Y.Z),
          # so we DON'T rely on type=semver. Instead, when on a tag we strip
          # the leading "v" with a raw pattern that resolves at action-time.
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=match,pattern=v(\d+\.\d+(\.\d+)?),group=1
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ steps.ver.outputs.version }},enable=${{ github.event_name == 'workflow_dispatch' }}
          labels: |
            org.opencontainers.image.title=tesla-trail-map
            org.opencontainers.image.description=TeslaMate drive-trail playback (Go + Leaflet)
            org.opencontainers.image.licenses=UNLICENSED

      - name: Build & push (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          # Push only on tags or manual dispatch — PRs build to validate.
          push: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.ver.outputs.build_date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        if: steps.meta.outputs.tags != ''
        run: |
          echo "Tags pushed:"
          echo "${{ steps.meta.outputs.tags }}"
